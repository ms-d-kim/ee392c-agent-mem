<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Proposed prescriptive tier mapping</title>
  <desc id="desc">A prescriptive, logical-trace-derived memory-tier mapping with resident, bandwidth-oriented, and capacity-oriented tiers.</desc>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="600" y="56" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#222">
    Proposed prescriptive tier mapping
  </text>
  <text x="600" y="90" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#777">
    Derived from logical semantic/KV traces; not measured SRAM/HBM residency
  </text>

  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="210" y="138" width="780" height="145" rx="4" fill="#faece7" stroke="#7c2d14" stroke-width="2"/>
    <text x="240" y="183" font-size="22" font-weight="600" fill="#7c2d14">Tier 1 - Always-resident proposed tier</text>
    <text x="240" y="220" font-size="18" fill="#222">System prompt, user/problem framing, small reused state</text>
    <text x="240" y="252" font-size="15" fill="#555" font-style="italic">Small footprint, full-workflow lifetime, logical read every step</text>

    <rect x="210" y="330" width="780" height="145" rx="4" fill="#fbf1dc" stroke="#7c5510" stroke-width="2"/>
    <text x="240" y="375" font-size="22" font-weight="600" fill="#7c5510">Tier 2 - Bandwidth-oriented proposed tier</text>
    <text x="240" y="412" font-size="18" fill="#222">Active KV snapshot, recent messages, high-reuse context</text>
    <text x="240" y="444" font-size="15" fill="#555" font-style="italic">Latency-sensitive logical accesses; placement recommendation only</text>

    <rect x="210" y="522" width="780" height="145" rx="4" fill="#e6f1fb" stroke="#0c447c" stroke-width="2"/>
    <text x="240" y="567" font-size="22" font-weight="600" fill="#0c447c">Tier 3 - Capacity-oriented proposed tier</text>
    <text x="240" y="604" font-size="18" fill="#222">Large lower-reuse KV pressure and retained context</text>
    <text x="240" y="636" font-size="15" fill="#555" font-style="italic">Capacity-time pressure dominates; no cross-tier migration measured</text>

    <path d="M600 288 L600 321" stroke="#999" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M600 480 L600 513" stroke="#999" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="120" y="404" transform="rotate(-90 120 404)" text-anchor="middle" font-size="16" fill="#666">lower latency / higher cost per bit</text>
    <text x="1080" y="404" transform="rotate(90 1080 404)" text-anchor="middle" font-size="16" fill="#666">larger capacity</text>
    <text x="210" y="712" font-size="15" fill="#777">
      Use the final-v3 CSVs for updated numbers; the historical v2 batch is background only.
    </text>
  </g>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999"/>
    </marker>
  </defs>
</svg>
